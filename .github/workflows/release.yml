name: Publish release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install .NET 8
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $properties = [xml](Get-Content ./Directory.Build.props)
          $version = [string]$properties.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Version is missing from Directory.Build.props."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check whether release already exists
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          "exists=$($LASTEXITCODE -eq 0)" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Build, test and package
        if: steps.existing.outputs.exists != 'True'
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Runtime win-x64

      - name: Create signed-off release
        if: steps.existing.outputs.exists != 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = "build/PSVR2-iRacing-Haptics-v$env:RELEASE_VERSION-win-x64-portable.zip"
          $hash = "$zip.sha256"
          gh release create $env:RELEASE_TAG $zip $hash `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "PSVR2 iRacing Haptics $env:RELEASE_VERSION" `
            --generate-notes `
            --latest
